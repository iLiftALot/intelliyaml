[project]
name = "intelliyaml"
version = "0.1.0"
description = "YAML helpers for environment expansion and Python object resolution."
readme = "README.md"
authors = [{ name = "Nicholas Corbin", email = "nickcorbin17@yahoo.com" }]
maintainers = [{ name = "Nicholas Corbin", email = "nickcorbin17@yahoo.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
dependencies = [
  "dotenv>=0.9.9",
  "intellifunctools",
  "intellipath",
  "pkg-registry",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260724",
]
requires-python = ">= 3.13"

[project.urls]
bugs = "https://github.com/iLiftALot/intelliyaml/issues"
changelog = "https://github.com/iLiftALot/intelliyaml/blob/master/HISTORY.md"
documentation = "https://intelliyaml.readthedocs.io"
homepage = "https://github.com/iLiftALot/intelliyaml"

[project.scripts]
intelliyaml = "intelliyaml.cli:app"
yaml = "intelliyaml.cli:app"

[dependency-groups]
dev = [
  "concurrent-log-handler",
  "pytest",
  "pytest-cov",
  "pyright",
  "rich",
  "ruff",
  "rust-just",
  "uv"
]

[build-system]
requires = ["uv_build >= 0.12.1, <0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-vv -l -x"
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_level = "INFO"
log_file = "logs/pytest.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_file_level = "INFO"
log_file_mode = "a"
python_classes = ["Test*", "*Test"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
# Option	            Description
# -v or -vv	          Verbose output
# -l or --showlocals	Show local variables in tracebacks
# -ll                 Show all locals in tracebacks
# -s	                Don't capture stdout (show print statements)
# --tb=long           Full tracebacks
# --tb=short	        Shorter tracebacks
# --tb=no	            No tracebacks
# -x	                Stop on first failure
# --ff	              Run failed tests first
# -q	                Quiet mode
# --durations=10	    Show 10 slowest tests

[tool.uv]
package = true

[tool.uv.sources]
intellipath = { path = "../intellipath", editable = true }
intellifunctools = { path = "../intellifunctools", editable = true }
pkg-registry = { path = "../custom/pkg_registry", editable = true }
